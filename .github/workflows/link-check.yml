name: Link check

# Checks every external link in the docs with lychee, so a dead hotline page,
# a moved government form or a renamed agency site is caught instead of being
# handed to someone who needs it.
#   - pull requests that touch the docs: fails on a broken link, so it is fixed before merge
#   - monthly schedule (and manual runs): opens or updates one issue instead of failing silently
# Exclusions (tel: links, bot-blocking sites, placeholders) live in .lycheeignore,
# each with a comment saying why.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "23 9 1 * *" # 09:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403 and 429 are accepted: many .gov and nonprofit sites answer GitHub's
          # runners with 403 (bot blocking) or 429 (rate limiting) even when the page
          # is up, so those codes say nothing about the link. A 404, 410, DNS or
          # connection failure, or a 5xx that survives the retries still fails.
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --timeout 20
            --accept 200..=299,403,429
            --exclude-loopback
            './**/*.md'
          output: lychee/report.md
          fail: false
          jobSummary: true

      - name: Fail the pull request on broken links
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != '0'
        run: |
          # One annotation per broken link, so the failures are readable from the
          # checks API and the PR page, not only from the job summary.
          grep -E '^\* \[' lychee/report.md | head -50 | while IFS= read -r line; do
            echo "::error title=Broken link::${line#\* }"
          done
          echo "::error::lychee found broken links. The job summary lists each one."
          exit 1

      - name: Open or update the link-check issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Link check: broken links found"
          {
            echo "The scheduled link check found broken links ([run]($RUN_URL))."
            echo "Fix or replace each link, or add a commented exclusion to \`.lycheeignore\` if the site only blocks bots."
            echo
            cat lychee/report.md
          } > lychee/issue.md
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee/issue.md
          else
            gh issue create --title "$title" --body-file lychee/issue.md
          fi
